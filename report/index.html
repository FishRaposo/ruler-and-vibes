<style>
:root{

}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);
  font:14px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px;
  max-width:1100px;margin:0 auto}
h1{font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 4px}
h2{font-size:16px;margin:32px 0 8px}
.sub{color:var(--dim);font-size:12px}
.controls{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0;align-items:center}
.controls label{color:var(--dim);font-size:12px;margin-right:6px}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:6px;padding:4px 8px}
.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:16px}
#legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.leg{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block}
table{border-collapse:collapse;width:100%;margin:8px 0 20px;font-size:13px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:center}
th{color:var(--dim);font-weight:500}
td.run,th.run{text-align:left;white-space:nowrap}
.pass{color:#7dffa8}.fail{color:#ff7d8a}
.total{font-weight:600}
.flag{cursor:help}
td.commented{cursor:help;text-decoration:underline dotted var(--dim);
  text-underline-offset:3px}
tr.notes-row td{border-top:none;text-align:left;padding:2px 10px 6px}
tr.notes-row summary{font-size:12px}
.note-sec{margin:10px 0 2px;font-size:11px;font-weight:600;
  text-transform:uppercase;letter-spacing:.05em;color:var(--text)}
.crit-note{margin:6px 0 6px 12px;color:var(--dim);text-align:left;
  max-width:860px}
.crit-note b{color:var(--text);font-weight:500}
tr.invalidated td{color:var(--dim);text-decoration:line-through}
tr.invalidated td.note-cell{text-decoration:none;color:#ff7d8a;text-align:left}
details{text-align:left}
summary{cursor:pointer;color:var(--dim)}
a{color:#7db9ff}
.coverage{color:var(--dim);font-size:12px;margin:2px 0 6px}
svg text{fill:var(--dim);font-size:12px}
.empty{color:var(--dim);padding:24px;text-align:center}
.banner{margin:12px 0;padding:10px 14px;border-radius:8px;font-size:13px;
  border:1px solid var(--line);background:var(--panel);color:var(--text)}
.banner.warn{border-color:#c9a227;background:#1a1608;color:#f0d78c;
  box-shadow:0 0 0 1px rgba(201,162,39,.35)}
.banner.ok{border-color:#2a5a3a;background:#0d1a12;color:#9ed9b0}
.banner .big{display:block;font-size:14px;margin-bottom:4px;letter-spacing:.03em}
.banner strong{font-weight:600}
.badge-prov{display:inline-block;margin-left:6px;padding:1px 6px;
  border-radius:4px;font-size:10px;letter-spacing:.04em;font-weight:600;
  text-transform:uppercase;background:#5c4a10;color:#f0d78c;
  vertical-align:middle}
.leg.provisional{opacity:.92}
</style>

};
const WEIGHTS={objective:0.5,subjective:0.5};
/* Runs (distinct parallel forms, ids like story-01b-*) an evaluation aims
   to score per facet; the median across a facet's scored forms feeds the
   category mean. Display-only target — see AUTHOR.md. */
const RUNS_TARGET=3;
const COLORS=["#00e5ff","#ff4d97","#a3ff57","#ffb200","#b26bff","#ff6b4d","#4dc3ff","#ffe14d"];

/* ---------- data loading (defensive) ---------- */
const state={view:"combined",harness:"all",effort:"all",suite:"core",weighted:false,hidden:new Set()};
const $=s=>document.querySelector(s);

function loadRuns(){
  const out=[];const data=window.BENCH_DATA;
  if(!data||typeof data!=="object"||!data.runs||typeof data.runs!=="object"){
    console.warn("BENCH_DATA missing or malformed");return out;}
  for(const [id,run] of Object.entries(data.runs)){
    if(!run||typeof run!=="object"||!run.tests||typeof run.tests!=="object"){
      console.warn("skipping malformed run: "+id);continue;}
    const tests={};
    for(const [tid,t] of Object.entries(run.tests)){
      if(!TESTS[tid]){console.warn("unknown test "+tid+" in run "+id);continue;}
      if(!t||typeof t!=="object"){console.warn("bad entry "+tid+" in "+id);continue;}
      tests[tid]=t;
    }
    out.push({id,model:run.model||id,effort:run.effort||"unspecified",
      harness:run.harness||"unspecified",date:run.date||"",
      judgedBy:run.judgedBy||"?",
      suite:run.suite||null,
      wall_time_min:typeof run.wall_time_min==="number"?run.wall_time_min:null,
      approx_cost_usd:typeof run.approx_cost_usd==="number"?run.approx_cost_usd:null,
      notes:run.notes||null,
      consistency_pair:run.consistency_pair||null,
      reviewedBy:run.reviewedBy||null,reviewedOn:run.reviewedOn||null,
      tests});
  }
  return out;
}
const ALL_RUNS=loadRuns();
const CORE_IDS=SUITES.core||[];
const EXTENDED_IDS=SUITES.extended||[];
const CORE_SIZE=CORE_IDS.length;
const EXTENDED_SIZE=EXTENDED_IDS.length;
/** How many tests from a tier list a run has scored. */
function tierCoverage(run, ids){
  let n=0;
  for(const tid of ids)if(run.tests[tid])n++;
  return n;
}
function coreCoverage(run){return tierCoverage(run, CORE_IDS);}
function extendedCoverage(run){return tierCoverage(run, EXTENDED_IDS);}
function isCoreProvisional(run){
  const n=coreCoverage(run);
  return n>0&&n<CORE_SIZE;
}
function isExtendedProvisional(run){
  const n=extendedCoverage(run);
  const pastCore=n>coreCoverage(run);
  const aiming=run.suite==="extended"||pastCore;
  return aiming&&n>0&&n<EXTENDED_SIZE;
}
function isTierProvisional(run){
  return isCoreProvisional(run)||isExtendedProvisional(run);
}
const label=r=>{
  let s=r.model+" ("+r.effort+" · "+r.harness+")";
  const bits=[];
  if(r.suite)bits.push(r.suite);
  if(r.wall_time_min!=null)bits.push(r.wall_time_min+"m");
  if(r.approx_cost_usd!=null)bits.push("$"+r.approx_cost_usd);
  if(r.consistency_pair)bits.push("pair:"+r.consistency_pair);
  if(isCoreProvisional(r))
    bits.push("PROVISIONAL Core "+coreCoverage(r)+"/"+CORE_SIZE);
  else if(isExtendedProvisional(r))
    bits.push("PROVISIONAL Extended "+extendedCoverage(r)+"/"+EXTENDED_SIZE);
  return bits.length?s+" · "+bits.join(" · "):s;
};
const colorOf=id=>COLORS[ALL_RUNS.findIndex(r=>r.id===id)%COLORS.length];
function suiteTestSet(){
  const list=SUITES[state.suite];
  return list?new Set(list):null;
}
/** Banner for Core / Extended / Full ladder status. */
function renderSuiteBanner(){
  const box=$("#suite-banner");
  if(!box)return;
  box.innerHTML="";
  const runs=shownRuns();
  const baseLabel=r=>esc(label(r).replace(/ · PROVISIONAL[^·]*(?= · |$)/g,"").trim());

  if(state.suite==="core"){
    if(!runs.length){
      box.innerHTML='<div class="banner warn"><strong>Core</strong> — no visible runs. '
        +'Core is the '+CORE_SIZE+'-test general snapshot (tier 1 of Core ⊂ Extended ⊂ Full).'
        +'</div>';
      return;
    }
    const incomplete=runs.filter(r=>coreCoverage(r)<CORE_SIZE);
    if(incomplete.length){
      const lines=incomplete.map(r=>baseLabel(r)+': <strong>'
        +coreCoverage(r)+'/'+CORE_SIZE+'</strong>').join('; ');
      box.innerHTML='<div class="banner warn"><span class="big"><strong>PROVISIONAL — incomplete Core ('
        +incomplete.map(r=>coreCoverage(r)+'/'+CORE_SIZE).join(', ')
        +')</strong></span>'
        +'Not a finished overall score. Do not hire/fire from this radar alone. '
        +lines+'. Ladder: Core ⊂ Extended ⊂ Full.</div>';
    }else{
      box.innerHTML='<div class="banner ok"><strong>Core complete</strong> — '
        +'all '+CORE_SIZE+' Core axes scored for every visible run. '
        +'Ladder: Core ⊂ Extended ⊂ Full.</div>';
    }
    return;
  }

  if(state.suite==="extended"){
    if(!runs.length){
      box.innerHTML='<div class="banner warn"><strong>Extended</strong> — no visible runs. '
        +'Extended is the '+EXTENDED_SIZE+'-test serious general map (includes Core).'
        +'</div>';
      return;
    }
    const incomplete=runs.filter(r=>extendedCoverage(r)<EXTENDED_SIZE);
    if(incomplete.length){
      const lines=incomplete.map(r=>baseLabel(r)+': <strong>'
        +extendedCoverage(r)+'/'+EXTENDED_SIZE+'</strong>'
        +' (Core '+coreCoverage(r)+'/'+CORE_SIZE+')').join('; ');
      box.innerHTML='<div class="banner warn"><span class="big"><strong>PROVISIONAL — incomplete Extended</strong></span>'
        +'Not a finished serious general map. '+lines
        +'. Ladder: Core ⊂ Extended ⊂ Full.</div>';
    }else{
      box.innerHTML='<div class="banner ok"><strong>Extended complete</strong> — '
        +'all '+EXTENDED_SIZE+' Extended tests scored for every visible run. '
        +'Ladder: Core ⊂ Extended ⊂ Full.</div>';
    }
    return;
  }

  if(state.suite==="full"){
    const partialCore=runs.filter(isCoreProvisional);
    const partialExt=runs.filter(isExtendedProvisional);
    if(partialCore.length||partialExt.length){
      const bits=[];
      if(partialCore.length)
        bits.push('Core provisional: '
          +partialCore.map(r=>esc(r.model)+' '+coreCoverage(r)+'/'+CORE_SIZE).join(', '));
      if(partialExt.length)
        bits.push('Extended provisional: '
          +partialExt.map(r=>esc(r.model)+' '+extendedCoverage(r)+'/'+EXTENDED_SIZE).join(', '));
      box.innerHTML='<div class="banner warn"><strong>Full view</strong> — showing all forms. '
        +bits.join('. ')+'. For a finished overall map use suite filter '
        +'<code>core</code> or <code>extended</code> only after that tier is complete. '
        +'Ladder: Core ⊂ Extended ⊂ Full.</div>';
    }else{
      box.innerHTML='<div class="banner ok"><strong>Full</strong> — all forms in the item bank. '
        +'Ladder: Core ('+CORE_SIZE+') ⊂ Extended ('+EXTENDED_SIZE+') ⊂ Full. '
        +'Day suites remain separate workflow pickers.</div>';
    }
  }
}
function visibleRuns(){
  return ALL_RUNS.filter(r=>
    (state.harness==="all"||r.harness===state.harness)&&
    (state.effort==="all"||r.effort===state.effort));
}
function shownRuns(){return visibleRuns().filter(r=>!state.hidden.has(r.id));}
function runTestsScoped(run){
  const allow=suiteTestSet();
  if(!allow)return run.tests;
  const out={};
  for(const [tid,t] of Object.entries(run.tests))
    if(allow.has(tid))out[tid]=t;
  return out;
}

/* ---------- scoring (the ONLY place score math lives) ---------- */
function sectionScores(tid,t){
  const cfg=TESTS[tid];
  const ov=cfg.objective.map(o=>t.objective&&t.objective[o[0]])
    .filter(v=>v===0||v===10);
  const obj=ov.length?ov.reduce((a,b)=>a+b,0)/ov.length:null;
  let sw=0,ss=0;
  for(const [sid,,w] of cfg.subjective){
    const v=t.subjective&&t.subjective[sid];
    if(typeof v==="number"){ss+=v*w;sw+=w;}
  }
  return {obj,subj:sw?ss/sw:null};
}
function testScore(tid,t,view){
  if(t.integrity==="invalidated")return null;
  const {obj,subj}=sectionScores(tid,t);
  if(view==="objective")return obj;
  if(view==="subjective")return subj;
  if(obj==null)return subj;
  if(subj==null)return obj;
  const w=TESTS[tid].weights||WEIGHTS;   // per-test override (e.g. 0.7/0.3)
  return w.objective*obj+w.subjective*subj;
}
/* Facet: parallel forms (story-01b-*, story-01c-*) share their source's
   facet id (story-01). A facet's score is the MEDIAN of its scored forms
   — n distinct forms = n runs of one construct — and the category is the
   mean of its attempted facets. Facets with a single scored test (the
   common case) behave exactly as before. */
const facetOf=tid=>{const m=tid.match(/^([a-z0-9]+-\d{2})[a-z]?-/);
  return m?m[1]:tid;};
const median=v=>{const s=[...v].sort((a,b)=>a-b);if(!s.length)return null;
  const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
// Bootstrap 95% CI (percentile) over facet medians. Returns [lo,hi] or null.
function bootstrapCI(vals,iters){
  if(vals.length<2)return null;
  const n=vals.length,seed=Date.now();
  let s=seed>>>0;
  const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};
  const out=[];
  for(let i=0;i<iters;i++){
    const sample=[];
    for(let j=0;j<n;j++)sample.push(vals[Math.floor(rnd()*n)]);
    out.push(sample.reduce((a,b)=>a+b,0)/sample.length);
  }
  out.sort((a,b)=>a-b);
  return [out[Math.floor(out.length*0.025)],out[Math.floor(out.length*0.975)]];
}
// Default weighting: equal-mean of facet medians (original behaviour).
// Weighted mode (state.weighted) divides by number of attempted facets so a
// 3-facet category doesn't count as much as a 40-facet one.
function categoryScore(run,cat,view){
  const byFacet={};
  const tests=runTestsScoped(run);
  for(const [tid,t] of Object.entries(tests)){
    if(!TESTS[tid]||TESTS[tid].category!==cat)continue;
    const s=testScore(tid,t,view);
    if(s!=null){const f=facetOf(tid);(byFacet[f]=byFacet[f]||[]).push(s);}
  }
  const facetMedians=Object.values(byFacet).map(median).filter(v=>v!=null);
  if(!facetMedians.length)return null;
  const mean=facetMedians.reduce((a,b)=>a+b,0)/facetMedians.length;
  const availableFacets=facetMedians.length;
  const ci=bootstrapCI(facetMedians,1000);
  let weightedMean=null;
  if(state.weighted){
    const totalFacets=Object.values(TESTS).filter(e=>e.category===cat).length;
    weightedMean=totalFacets?mean*availableFacets/totalFacets:mean;
  }
  return {score:mean,n:availableFacets,ci,
    weighted:weightedMean,provisional:availableFacets<2};
}

/* ---------- radar ---------- */
const SVGNS="http://www.w3.org/2000/svg";
function el(name,attrs,text){
  const e=document.createElementNS(SVGNS,name);
  for(const k in attrs)e.setAttribute(k,attrs[k]);
  if(text!=null)e.textContent=text;
  return e;
}
function renderRadar(){
  const svg=$("#radar");svg.innerHTML="";
  const runs=shownRuns();
  const cats=CATEGORIES.filter(c=>runs.some(r=>categoryScore(r,c.id,state.view)));
  if(!cats.length){
    svg.appendChild(el("text",{x:320,y:260,"text-anchor":"middle"},
      "No data yet — judge a run to populate this chart."));
    return;
  }
  const cx=320,cy=250,R=185,n=cats.length;
  const ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v/10,cy+Math.sin(ang(i))*R*v/10];
  for(let ring=2;ring<=10;ring+=2){
    const pts=cats.map((_,i)=>pt(i,ring).join(",")).join(" ");
    svg.appendChild(el("polygon",{points:pts,fill:"none",
      stroke:"var(--line)","stroke-width":ring===10?1.5:0.75}));
  }
  cats.forEach((c,i)=>{
    const [x,y]=pt(i,10);
    svg.appendChild(el("line",{x1:cx,y1:cy,x2:x,y2:y,
      stroke:"var(--line)","stroke-width":0.75}));
    const [lx,ly]=pt(i,11.6);
    const anchor=Math.abs(Math.cos(ang(i)))<0.3?"middle":
      (Math.cos(ang(i))>0?"start":"end");
    svg.appendChild(el("text",{x:lx,y:ly,"text-anchor":anchor,
      "dominant-baseline":"middle"},c.label));
  });
  runs.forEach(run=>{
    const color=colorOf(run.id);
    const vals=cats.map(c=>categoryScore(run,c.id,state.view));
    const pts=vals.map((v,i)=>pt(i,v?(state.weighted&&v.weighted!=null?v.weighted:v.score):0));
    svg.appendChild(el("polygon",{
      points:pts.map(p=>p.join(",")).join(" "),
      fill:color,"fill-opacity":0.10,stroke:color,"stroke-width":2}));
    vals.forEach((v,i)=>{
      const [x,y]=pts[i];
      const tip=v?((state.weighted&&v.weighted!=null?v.weighted:v.score).toFixed(1)
        +(v.ci?"  (95% CI "+(state.weighted&&v.weighted!=null?v.weighted:v.score).toFixed(1)
          +" ±"+(((v.ci[1]-v.ci[0])/2).toFixed(1))+")":"")
        +(v.provisional?"  [provisional: 1 form]"):"no data");
      svg.appendChild(v
        ?el("circle",{cx:x,cy:y,r:4,fill:color,title:tip})
        :el("circle",{cx:x,cy:y,r:4,fill:"var(--bg)",stroke:color,
            "stroke-dasharray":"2 2"}));  // gap marker: no data in category
    });
  });
}

/* ---------- legend + controls ---------- */
function renderLegend(){
  const box=$("#legend");box.innerHTML="";
  visibleRuns().forEach(run=>{
    const l=document.createElement("label");l.className="leg";
    if(isTierProvisional(run))l.classList.add("provisional");
    const cb=document.createElement("input");cb.type="checkbox";
    cb.checked=!state.hidden.has(run.id);
    cb.addEventListener("change",()=>{
      cb.checked?state.hidden.delete(run.id):state.hidden.add(run.id);
      renderRadar();renderSuiteBanner();renderTables();
    });
    const sw=document.createElement("span");sw.className="swatch";
    sw.style.background=colorOf(run.id);
    l.append(cb,sw,document.createTextNode(label(run)));
    if(isTierProvisional(run)){
      const badge=document.createElement("span");
      badge.className="badge-prov";
      if(isCoreProvisional(run)){
        badge.title="Incomplete Core ("+coreCoverage(run)+"/"+CORE_SIZE+")";
        badge.textContent="prov core";
      }else{
        badge.title="Incomplete Extended ("+extendedCoverage(run)+"/"+EXTENDED_SIZE+")";
        badge.textContent="prov ext";
      }
      l.appendChild(badge);
    }
    box.appendChild(l);
  });
}
function fillSelect(sel,values){
  sel.innerHTML="";
  const all=document.createElement("option");
  all.value="all";all.textContent="All";sel.appendChild(all);
  [...new Set(values)].sort().forEach(v=>{
    const o=document.createElement("option");
    o.value=v;o.textContent=v;sel.appendChild(o);
  });
}

/* ---------- tables ---------- */
function chip(v){
  if(v===10)return '<span class="pass">PASS</span>';
  if(v===0)return '<span class="fail">FAIL</span>';
  return '<span>–</span>';
}
function fmt(v){return v==null?"–":v.toFixed(1);}
function esc(s){return String(s).replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

// Empirical difficulty: what fraction of all scored runs passed this test's
// objective section. -1 = not enough data yet (fewer than 2 scored runs).
function difficultyPassRate(tid){
  let total=0,passed=0;
  for(const run of ALL_RUNS){
    const t=run.tests[tid];if(!t||t.integrity==="invalidated")continue;
    const cfg=TESTS[tid];if(!cfg)continue;
    const vals=cfg.objective.map(o=>t.objective&&t.objective[o[0]])
      .filter(v=>v===0||v===10);
    if(!vals.length)continue;
    total++;
    if(vals.every(v=>v===10))passed++;
  }
  return total>=2?passed/total:-1;
}

function reviewBlock(run, t, tid, cfg){
  if(!run.reviewedBy)return"";
  const rv=t.reviews;
  if(!rv||typeof rv!=="object"||!Object.keys(rv).length)return"";
  let agreed=0,total=0;
  const rows=(cfg.subjective||[]).map(([sid,name])=>{
    const rev=rv[sid];if(!rev)return"";
    total++;
    const agree=rev.verdict==="agree";
    if(agree)agreed++;
    const icon=agree?"✓":"✗";
    const cls=agree?"pass":"fail";
    const scoreText=agree
      ?"scored "+(t.subjective&&t.subjective[sid])
      :"reviewer gives "+(rev.score!=null?rev.score:"?")
        +" (judge: "+(t.subjective&&t.subjective[sid])+")";
    return '<div class="crit-note"><span class="'+cls+'">'+icon
      +'</span> <b>'+esc(name)+'</b> &mdash; '+esc(rev.verdict)
      +' · '+esc(scoreText)+' &mdash; '+esc(rev.comment||"")+'</div>';
  }).join("");
  if(!total)return"";
  return '<div class="note-sec">Review'
    +' (<span class="pass">'+agreed+'</span>/'+total+' agreed'
    +', by '+esc(run.reviewedBy)
    +(run.reviewedOn?' on '+esc(run.reviewedOn):'')+')</div>'+rows;
}

function renderTables(){
  const box=$("#tables");box.innerHTML="";
  const runs=shownRuns();
  const allow=suiteTestSet();
  for(const cat of CATEGORIES){
    let testIds=Object.keys(TESTS).filter(t=>TESTS[t].category===cat.id);
    if(allow)testIds=testIds.filter(t=>allow.has(t));
    if(!testIds.length)continue;
    const attempted=runs.filter(r=>testIds.some(t=>r.tests[t]));
    if(!attempted.length)continue;
    const h=document.createElement("h2");h.textContent=cat.label;
    box.appendChild(h);
    const facetsAll=[...new Set(testIds.map(facetOf))];
    for(const r of attempted){
      const entries=testIds.filter(t=>r.tests[t]);
      const facetsRun=[...new Set(entries.map(facetOf))];
      const invalid=entries.filter(t=>
        r.tests[t].integrity==="invalidated").length;
      const div=document.createElement("div");div.className="coverage";
      // "tests" when facet==test everywhere (no parallel forms in play);
      // facet wording once the category has forms registered
      let covText=label(r)+": "+
        (testIds.length===facetsAll.length
          ?entries.length+"/"+testIds.length+" tests run"
          :facetsRun.length+"/"+facetsAll.length+" facets run ("
            +entries.length+(entries.length===1?" run":" runs")
            +(entries.length>facetsRun.length?" incl. parallel forms":"")
            +")")
        +(invalid?", "+invalid+" invalidated":"");
      if(state.suite==="core"&&isCoreProvisional(r))
        covText+=" — PROVISIONAL Core "+coreCoverage(r)+"/"+CORE_SIZE;
      if(state.suite==="extended"&&extendedCoverage(r)<EXTENDED_SIZE)
        covText+=" — PROVISIONAL Extended "+extendedCoverage(r)+"/"+EXTENDED_SIZE;
      // Per-category provisional: only 1 facet attempted -> low statistical
      // confidence, surface it so a single-form category isn't read as solid.
      const cs=categoryScore(r,cat.id,state.view);
      if(cs&&cs.provisional)
        covText+=" — PROVISIONAL (1 facet, low confidence)"
          +(cs.ci?" [95% CI ±"+((cs.ci[1]-cs.ci[0])/2).toFixed(1)+"]":"" );
      div.textContent=covText;
      box.appendChild(div);
    }
    const facetGroups={};
    for(const t of testIds){
      const f=facetOf(t);(facetGroups[f]=facetGroups[f]||[]).push(t);
    }
    for(const [fid,ftids] of Object.entries(facetGroups)){
    for(const tid of ftids){
      const withEntry=runs.filter(r=>r.tests[tid]);
      if(!withEntry.length)continue;
      const cfg=TESTS[tid];
      const dRate=difficultyPassRate(tid);
      const dBadge=dRate>=0
        ?' <span class="sub" title="objective pass rate across all scored runs">('
          +Math.round(dRate*100)+'% pass)</span>':'';
      const tbl=document.createElement("table");
      const nCols=1+cfg.objective.length+cfg.subjective.length+1;
      const head='<tr><th class="run">'+esc(cfg.title)
        +' <span class="sub">('+tid+')</span>'+dBadge+'</th>'
        +cfg.objective.map(o=>"<th>"+esc(o[1])+"</th>").join("")
        +cfg.subjective.map(s=>"<th>"+esc(s[1])+"</th>").join("")
        +"<th>Total</th></tr>";
      const rows=withEntry.map(r=>{
        const t=r.tests[tid];
        const link='<a href="judgments/'+esc(r.id)+'/'+tid
          +'.md">full judgment</a>';
        if(t.integrity==="invalidated"){
          return '<tr class="invalidated"><td class="run">'+esc(label(r))
            +'</td><td class="note-cell" colspan="'+(nCols-1)
            +'">INVALIDATED — '
            +esc(t.integrityNote||"integrity violation")
            +' — '+link+'</td></tr>';
        }
        const flag=t.integrity==="flagged"
          ?' <span class="flag" title="'
            +esc(t.integrityNote||"integrity flag")+'">⚠</span>':'';
        const cm=(t.comments&&typeof t.comments==="object")?t.comments:{};
        const cell=(id,inner)=>'<td'+(cm[id]?' class="commented" title="'
          +esc(cm[id])+'"':'')+'>'+inner+'</td>';
        const critNotes=cfg.objective.concat(cfg.subjective)
          .filter(c=>cm[c[0]])
          .map(c=>'<div class="crit-note"><b>'+esc(c[1])+':</b> '
            +esc(cm[c[0]])+'</div>').join("");
        const rs=(t.reasoning&&typeof t.reasoning==="object")
          ?t.reasoning:null;
        const reasonBlock=rs
          ?'<div class="note-sec">Model reasoning (its own words, condensed)</div>'
            +(rs.approach?'<div class="crit-note"><b>Approach:</b> '
              +esc(rs.approach)+'</div>':'')
            +(rs.decisions?'<div class="crit-note"><b>Key decisions:</b> '
              +esc(rs.decisions)+'</div>':'')
            +(rs.limitations
              ?'<div class="crit-note"><b>Trade-offs &amp; limitations:</b> '
              +esc(rs.limitations)+'</div>':'')
            +'<div class="crit-note"><a href="../results/'+esc(r.id)+'/'
            +tid+'/REASONING.md">full REASONING.md</a></div>'
          :'';
        return '<tr><td class="run">'+esc(label(r))+flag+'</td>'
          +cfg.objective.map(o=>cell(o[0],
            chip(t.objective&&t.objective[o[0]]))).join("")
          +cfg.subjective.map(s=>cell(s[0],
            fmt(typeof (t.subjective&&t.subjective[s[0]])==="number"
              ?t.subjective[s[0]]:null))).join("")
          +'<td class="total">'+fmt(testScore(tid,t,state.view))+'</td></tr>'
          +'<tr class="notes-row"><td colspan="'+nCols
          +'"><details><summary>notes — '+esc(label(r))+'</summary>'
          +reasonBlock
          +'<div class="note-sec">Judge notes</div>'
          +'<div class="crit-note"><b>Verdict note:</b> '
          +esc(t.note||"")+'</div>'
          +critNotes
          +reviewBlock(r,t,tid,cfg)
          +'<div class="crit-note">'+link+'</div></details></td></tr>';
      }).join("");
      tbl.innerHTML=head+rows;
      box.appendChild(tbl);
    }
    // facet median summary — only where parallel forms are actually scored
    if(ftids.length>1){
      for(const r of runs){
        const scored=ftids
          .map(t=>r.tests[t]?testScore(t,r.tests[t],state.view):null)
          .filter(s=>s!=null);
        if(scored.length>=2){
          const div=document.createElement("div");div.className="coverage";
          div.textContent="facet "+fid+" · "+label(r)+": median "
            +fmt(median(scored))+" across "+scored.length+" runs"
            +(scored.length<RUNS_TARGET?" (target "+RUNS_TARGET+")":"");
          box.appendChild(div);
        }
      }
    }
    }
  }
  if(!box.children.length)
    box.innerHTML='<div class="empty">No judged runs yet.</div>';
}

/* ---------- init ---------- */
function init(){
  let updatedText=window.BENCH_DATA&&window.BENCH_DATA.updated
      ?"updated "+window.BENCH_DATA.updated:"";
  // review summary
  let totalReviewed=0,totalCriteria=0,totalAgreed=0;
  if(window.BENCH_DATA&&window.BENCH_DATA.runs){
    for(const run of Object.values(window.BENCH_DATA.runs)){
      if(!run.reviewedBy)continue;
      for(const t of Object.values(run.tests||{})){
        if(!t.reviews)continue;
        const vals=Object.values(t.reviews);
        totalCriteria+=vals.length;
        for(const rv of vals){
          if(rv.verdict==="agree")totalAgreed++;
        }
      }
      totalReviewed++;
    }
  }
  if(totalReviewed)
    updatedText+=" · reviewed: "+totalReviewed+" run(s), "
      +totalAgreed+"/"+totalCriteria+" agreed";
  $("#updated").textContent=updatedText;
  fillSelect($("#harness"),ALL_RUNS.map(r=>r.harness));
  fillSelect($("#effort"),ALL_RUNS.map(r=>r.effort));
  const suiteSel=$("#suite");
  suiteSel.innerHTML="";
  for(const id of Object.keys(SUITES)){
    const o=document.createElement("option");
    o.value=id;o.textContent=id==="full"?"full (all forms)":id==="core"?"core (34)":id==="extended"?"extended (123)":id;
    suiteSel.appendChild(o);
  }
  $("#view").addEventListener("change",e=>{
    state.view=e.target.value;renderRadar();renderSuiteBanner();renderTables();});
  $("#harness").addEventListener("change",e=>{
    state.harness=e.target.value;renderLegend();renderRadar();renderSuiteBanner();renderTables();});
  $("#effort").addEventListener("change",e=>{
    state.effort=e.target.value;renderLegend();renderRadar();renderSuiteBanner();renderTables();});
  $("#weight").addEventListener("change",e=>{
    state.weighted=e.target.value==="weighted";renderLegend();renderRadar();renderSuiteBanner();renderTables();});
  $("#suite").addEventListener("change",e=>{
    state.suite=e.target.value;renderRadar();renderSuiteBanner();renderTables();});
  renderLegend();renderRadar();renderSuiteBanner();renderTables();
}
init();
</script>
