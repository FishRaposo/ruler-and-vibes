<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lighthouse at Dusk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; width: 100vw; height: 100vh; }

  .sky {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #0b0e2a 0%, #1a1a4e 30%, #d4623a 70%, #f0a050 100%);
  }

  .star {
    position: absolute; width: 3px; height: 3px; background: #fff; border-radius: 50%;
    animation: twinkle 2s ease-in-out infinite alternate;
  }
  .star:nth-child(2) { top: 8%; left: 15%; animation-delay: 0.3s; }
  .star:nth-child(3) { top: 12%; left: 45%; animation-delay: 0.7s; }
  .star:nth-child(4) { top: 5%; left: 70%; animation-delay: 1.1s; }
  .star:nth-child(5) { top: 18%; left: 85%; animation-delay: 0.5s; }
  .star:nth-child(6) { top: 10%; left: 30%; animation-delay: 1.5s; }
  .star:nth-child(7) { top: 15%; left: 60%; animation-delay: 0.9s; }
  .star:nth-child(8) { top: 3%; left: 50%; animation-delay: 1.8s; }

  @keyframes twinkle {
    0% { opacity: 0.3; }
    100% { opacity: 1; }
  }

  /* Cliff */
  .cliff {
    position: absolute; bottom: 0; left: 0; width: 55%; height: 35%;
    background: linear-gradient(135deg, #2a2a2a 0%, #3d3d3d 60%, #4a4a4a 100%);
    clip-path: polygon(0% 30%, 15% 20%, 35% 15%, 55% 25%, 70% 20%, 100% 35%, 100% 100%, 0% 100%);
  }

  /* Grass on cliff */
  .cliff::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 20%;
    background: linear-gradient(180deg, #2d5a27 0%, #3d3d3d 100%);
    clip-path: polygon(0% 30%, 15% 20%, 35% 15%, 55% 25%, 70% 20%, 100% 35%, 100% 0%, 0% 0%);
  }

  /* Lighthouse base */
  .lighthouse-base {
    position: absolute; bottom: 35%; left: 38%;
    width: 40px; height: 80px;
    background: linear-gradient(90deg, #ddd 0%, #fff 40%, #ddd 100%);
    border-radius: 2px;
  }

  /* Red stripe */
  .lighthouse-base::before {
    content: ''; position: absolute; top: 15px; left: 0; width: 100%; height: 25px;
    background: #c0392b;
  }
  .lighthouse-base::after {
    content: ''; position: absolute; top: 55px; left: 0; width: 100%; height: 25px;
    background: #c0392b;
  }

  /* Lighthouse top */
  .lighthouse-top {
    position: absolute; bottom: calc(35% + 80px); left: 36%;
    width: 48px; height: 20px;
    background: #333;
    border-radius: 2px 2px 0 0;
  }

  /* Lantern room */
  .lantern {
    position: absolute; bottom: calc(35% + 100px); left: 37.5%;
    width: 44px; height: 24px;
    background: rgba(255, 220, 100, 0.9);
    border: 2px solid #555;
    box-shadow: 0 0 30px rgba(255, 200, 50, 0.8), 0 0 60px rgba(255, 200, 50, 0.4);
  }

  /* Light beam */
  .beam {
    position: absolute; bottom: calc(35% + 105px); left: calc(38% + 44px);
    width: 0; height: 0;
    border-top: 80px solid transparent;
    border-bottom: 80px solid transparent;
    border-left: 300px solid rgba(255, 220, 100, 0.15);
    transform-origin: left center;
    animation: sweep 4s ease-in-out infinite alternate;
  }

  @keyframes sweep {
    0% { transform: rotate(-25deg); }
    100% { transform: rotate(15deg); }
  }

  /* Ocean */
  .ocean {
    position: absolute; bottom: 0; left: 45%; width: 55%; height: 35%;
    background: linear-gradient(180deg, #1a3a5c 0%, #0d2137 100%);
  }

  /* Waves */
  .wave {
    position: absolute; left: 45%; width: 55%; height: 8px;
    background: repeating-linear-gradient(90deg,
      transparent 0px, transparent 20px,
      rgba(100, 180, 255, 0.3) 20px, rgba(100, 180, 255, 0.3) 40px
    );
    border-radius: 50%;
    animation: drift 3s linear infinite;
  }
  .wave:nth-of-type(1) { bottom: 30%; animation-delay: 0s; }
  .wave:nth-of-type(2) { bottom: 22%; animation-delay: 1s; opacity: 0.6; }
  .wave:nth-of-type(3) { bottom: 14%; animation-delay: 2s; opacity: 0.4; }

  @keyframes drift {
    0% { transform: translateX(0); }
    100% { transform: translateX(-40px); }
  }

  /* Sun/moon glow on horizon */
  .sun {
    position: absolute; bottom: 32%; left: 65%;
    width: 50px; height: 50px; border-radius: 50%;
    background: radial-gradient(circle, #f5c842 0%, #f0a050 40%, transparent 70%);
    box-shadow: 0 0 60px 20px rgba(240, 160, 80, 0.3);
  }
</style>
</head>
<body>
  <div class="sky">
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
    <div class="star"></div>
  </div>
  <div class="sun"></div>
  <div class="cliff"></div>
  <div class="lighthouse-base"></div>
  <div class="lighthouse-top"></div>
  <div class="lantern"></div>
  <div class="beam"></div>
  <div class="ocean"></div>
  <div class="wave"></div>
  <div class="wave"></div>
  <div class="wave"></div>
</body>
</html>
