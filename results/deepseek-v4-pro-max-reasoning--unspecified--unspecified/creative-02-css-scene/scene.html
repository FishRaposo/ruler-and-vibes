<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lighthouse at Dusk</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.scene { position: relative; width: 400px; height: 500px; overflow: hidden; }
.sky { position: absolute; top: 0; left: 0; width: 100%; height: 65%; background: linear-gradient(to bottom, #0d1b2a 0%, #1b2838 20%, #415a77 50%, #778da9 80%, #e07a5f 95%, #f4a261 100%); }
.star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 3s infinite alternate; }
.star:nth-child(1) { width: 2px; height: 2px; top: 10%; left: 15%; animation-delay: 0s; }
.star:nth-child(2) { width: 1px; height: 1px; top: 15%; left: 30%; animation-delay: 0.5s; }
.star:nth-child(3) { width: 2px; height: 2px; top: 8%; left: 50%; animation-delay: 1s; }
.star:nth-child(4) { width: 1px; height: 1px; top: 20%; left: 70%; animation-delay: 1.5s; }
.star:nth-child(5) { width: 2px; height: 2px; top: 5%; left: 85%; animation-delay: 0.3s; }
.star:nth-child(6) { width: 1px; height: 1px; top: 25%; left: 10%; animation-delay: 2s; }
.star:nth-child(7) { width: 2px; height: 2px; top: 12%; left: 60%; animation-delay: 0.8s; }
.star:nth-child(8) { width: 1px; height: 1px; top: 30%; left: 40%; animation-delay: 1.2s; }

.ocean { position: absolute; bottom: 0; left: 0; width: 100%; height: 40%; background: linear-gradient(to bottom, #1a3a4a 0%, #0d2137 30%, #0a1628 100%); }
.wave { position: absolute; bottom: 0; left: -50%; width: 200%; height: 20px; background: repeating-linear-gradient(90deg, transparent, transparent 30px, rgba(255,255,255,0.08) 30px, rgba(255,255,255,0.08) 60px); animation: waves 4s ease-in-out infinite; }
.wave:nth-child(2) { bottom: 8px; animation-delay: 0.5s; animation-duration: 3.5s; opacity: 0.6; }
.wave:nth-child(3) { bottom: 4px; animation-delay: 1s; animation-duration: 4.5s; opacity: 0.4; }

.cliff { position: absolute; bottom: 30%; left: 0; width: 100%; height: 30%; background: linear-gradient(to bottom, #3d3d3d 0%, #2a2a2a 100%); clip-path: polygon(0% 50%, 5% 40%, 12% 45%, 18% 30%, 25% 35%, 30% 25%, 35% 30%, 40% 20%, 45% 28%, 48% 22%, 50% 15%, 52% 25%, 55% 20%, 60% 30%, 65% 22%, 70% 35%, 75% 28%, 80% 40%, 85% 32%, 90% 45%, 95% 38%, 100% 50%, 100% 100%, 0% 100%); }

.lighthouse { position: absolute; bottom: 36%; left: 50%; transform: translateX(-50%); }
.tower { width: 36px; height: 100px; background: linear-gradient(to right, #e8e8e8 0%, #fafafa 20%, #fafafa 80%, #d0d0d0 100%); border-radius: 40% 40% 0 0; position: relative; z-index: 1; }
.stripe { position: absolute; width: 100%; height: 14px; background: #cc2222; }
.stripe:nth-child(1) { top: 14px; }
.stripe:nth-child(2) { top: 42px; }
.stripe:nth-child(3) { top: 70px; }
.lantern { width: 28px; height: 34px; background: linear-gradient(to bottom, #ffe066 0%, #ffd700 50%, #ffb703 100%); margin: 0 auto; border-radius: 4px; box-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 40px rgba(255,200,0,0.4); position: relative; z-index: 2; }
.roof { width: 0; height: 0; border-left: 22px solid transparent; border-right: 22px solid transparent; border-bottom: 16px solid #c0392b; margin: 0 auto; position: relative; z-index: 3; }
.beam { position: absolute; top: 60px; left: 50%; width: 160px; height: 160px; transform-origin: bottom center; animation: sweep 4s linear infinite; z-index: 0; }
.beam::before { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 60px solid transparent; border-right: 60px solid transparent; border-bottom: 100px solid rgba(255,220,100,0.25); filter: blur(4px); }
.beam::after { content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 30px solid transparent; border-right: 30px solid transparent; border-bottom: 120px solid rgba(255,240,180,0.12); filter: blur(6px); }

.base { width: 46px; height: 14px; background: #666; margin: 0 auto; border-radius: 0 0 3px 3px; position: relative; z-index: 1; }

.moon { position: absolute; top: 8%; right: 12%; width: 36px; height: 36px; background: radial-gradient(circle at 35% 35%, #fefae0, #e9c46a); border-radius: 50%; box-shadow: 0 0 15px rgba(233,196,106,0.5); }

.horizon-glow { position: absolute; bottom: 30%; left: 0; width: 100%; height: 40px; background: linear-gradient(to top, rgba(228,140,80,0.3), transparent); }

@keyframes sweep {
  0% { transform: rotate(-30deg); }
  25% { transform: rotate(30deg); }
  50% { transform: rotate(-30deg); }
  75% { transform: rotate(30deg); }
  100% { transform: rotate(-30deg); }
}

@keyframes twinkle {
  0% { opacity: 0.3; }
  100% { opacity: 1; }
}

@keyframes waves {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(20px); }
}
</style>
</head>
<body>
<div class="scene">
  <div class="sky">
    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="moon"></div>
    <div class="horizon-glow"></div>
  </div>
  <div class="cliff"></div>
  <div class="lighthouse">
    <div class="roof"></div>
    <div class="lantern"></div>
    <div class="beam"></div>
    <div class="tower">
      <div class="stripe"></div><div class="stripe"></div><div class="stripe"></div>
    </div>
    <div class="base"></div>
  </div>
  <div class="ocean">
    <div class="wave"></div>
    <div class="wave"></div>
    <div class="wave"></div>
  </div>
</div>
</body>
</html>
